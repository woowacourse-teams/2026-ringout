name: Spring Server CD

on:
  workflow_run:
    workflows: [ "Server CI" ]
    types: [ completed ]
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: spring-${{ inputs.target_environment || (github.event.workflow_run.head_branch == 'develop' && 'development' || 'production') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'develop' ||
        github.event.workflow_run.head_branch == 'main'))
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - ${{ format('ringout-{0}', inputs.target_environment || (github.event.workflow_run.head_branch == 'develop' && 'development' || 'production')) }}
    environment: ${{ inputs.target_environment || (github.event.workflow_run.head_branch == 'develop' && 'development' || 'production') }}
    timeout-minutes: 15

    steps:
      - name: Checkout server deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            /server/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy Spring using EC2 environment
        env:
          DEPLOY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash server/deploy/deploy.sh
