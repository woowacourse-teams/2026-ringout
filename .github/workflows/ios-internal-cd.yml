name: iOS Internal TestFlight CD

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ios-internal-testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: client

jobs:
  gate:
    name: Wait for matching iOS CI success
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for successful iOS CI on this commit
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/ios_cd_gate.py

  internal-testflight:
    name: Archive and upload to internal TestFlight
    if: needs.gate.outputs.eligible == 'true'
    needs: gate
    runs-on: macos-26
    timeout-minutes: 90
    environment: ios-internal
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm checked out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Corretto JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
      - name: Prepare and validate signing inputs
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          RINGOUT_IOS_SECRETS_XCCONFIG_BASE64: ${{ secrets.RINGOUT_IOS_SECRETS_XCCONFIG_BASE64 }}
        run: python3 ci/ios_internal.py
      - name: Install Apple Distribution identity and provisioning profile
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/ringout-ios-internal/build.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$IOS_CERTIFICATE_PATH" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution'; then
            echo 'Apple Distribution signing identity was not imported' >&2
            exit 1
          fi
          profile_directory="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_directory"
          cp "$IOS_PROFILE_PATH" "$profile_directory/$IOS_PROFILE_UUID.mobileprovision"
      - name: Archive signed iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ringout.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM=475GWW72JW \
            RINGOUT_CI_PROFILE_UUID="$IOS_PROFILE_UUID" \
            archive
      - name: Verify signed archive and development Firebase
        run: |
          app="$RUNNER_TEMP/Ringout.xcarchive/Products/Applications/Ringout.app"
          python3 ci/verify_ios_firebase.py \
            --source iosApp/iosApp/GoogleService-Info.plist \
            --app "$app"
          codesign --verify --deep --strict "$app"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings -json > "$RUNNER_TEMP/ringout-ios-release-settings.json"
          python3 ci/verify_ios_version.py \
            --settings "$RUNNER_TEMP/ringout-ios-release-settings.json" \
            --app "$app"
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/embedded-profile.plist")" = "$IOS_PROFILE_UUID"
      - name: Upload internal-only build to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ringout.xcarchive" \
            -exportPath "$RUNNER_TEMP/ringout-ios-export" \
            -exportOptionsPlist "$IOS_EXPORT_OPTIONS_PATH" \
            -authenticationKeyPath "$IOS_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ringout-ios-internal/build.keychain-db" 2>/dev/null || true
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f iosApp/Configuration/RingoutSecrets.xcconfig
          rm -rf "$RUNNER_TEMP/ringout-ios-internal"
