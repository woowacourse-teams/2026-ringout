name: Front workflow

on:
  push:
    branches: [front/develop]
    paths:
      - 'admin/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      FRONTEND_DIR: ${{ vars.FRONTEND_DIR || 'admin' }}
      BUILD_DIR: ${{ vars.FRONTEND_BUILD_DIR || 'dist' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.FRONTEND_NODE_VERSION || '22' }}
          package-manager-cache: false

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_APP_ENV: production
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$VITE_API_BASE_URL" || { echo '::error::VITE_API_BASE_URL variable is missing.'; exit 1; }
          npm ci
          npm run build
          test -f "${BUILD_DIR}/index.html"
          tar -czf "${RUNNER_TEMP}/frontend.tar.gz" -C "$BUILD_DIR" .

      - name: Save frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, ARM64, ringout-production]
    environment: production
    timeout-minutes: 15
    env:
      S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_PAGER: ''
    steps:
      - name: Validate deployment settings
        env:
          DEPLOY_DIR: ${{ runner.temp }}/ringout-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { printf '::error::%s\n' "$1"; exit 1; }
          [[ "$S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || fail 'FRONTEND_S3_BUCKET variable is missing or invalid; use a bucket name only.'
          [[ "$DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]] || fail 'FRONTEND_CLOUDFRONT_DISTRIBUTION_ID variable is missing or invalid; use the distribution ID, not its domain.'
          [[ "$AWS_DEFAULT_REGION" =~ ^[a-z0-9-]+$ ]] || fail 'AWS_REGION is invalid.'
          command -v aws >/dev/null || fail 'AWS CLI must be installed on the production runner.'
          umask 077
          mkdir -p "$DEPLOY_DIR"

      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: frontend-${{ github.run_id }}
          path: ${{ runner.temp }}/ringout-frontend-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload frontend using EC2 instance role
        env:
          DEPLOY_DIR: ${{ runner.temp }}/ringout-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the instance role, without changing the runner's saved credentials.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_PROFILE
          export AWS_SHARED_CREDENTIALS_FILE=/dev/null
          export AWS_CONFIG_FILE=/dev/null
          aws sts get-caller-identity >/dev/null
          mkdir -p "$DEPLOY_DIR/build"
          tar -xzf "$DEPLOY_DIR/frontend.tar.gz" -C "$DEPLOY_DIR/build"
          test -f "$DEPLOY_DIR/build/index.html"
          aws s3 sync "$DEPLOY_DIR/build/" "s3://$S3_BUCKET/frontend/" --exclude 'index.html' --only-show-errors
          aws s3 cp "$DEPLOY_DIR/build/index.html" "s3://$S3_BUCKET/frontend/index.html" \
            --cache-control 'no-cache' --content-type 'text/html' --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' >/dev/null
          echo 'Frontend uploaded; CloudFront invalidation requested.'

      - name: Remove this run's temporary build files
        env:
          DEPLOY_DIR: ${{ runner.temp }}/ringout-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_dir="${RUNNER_TEMP}/ringout-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$DEPLOY_DIR" == "$expected_dir" ]]
          rm -rf -- "$DEPLOY_DIR"
