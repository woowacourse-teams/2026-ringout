name: Build Signed Release AAB

on:
  push:
    branches: [develop, main]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
      - '.github/workflows/build-release-aab.yml'
      - '.github/actions/**'
  # Recovery only. Normal builds start automatically after a protected-branch merge.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: client

concurrency:
  group: ringout-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-aab:
    name: Build signed ${{ github.ref_name == 'main' && 'release' || 'internal' }} AAB
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ github.ref_name == 'main' && 'production' || 'internal' }}
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select channel and allocate versionCode
        env:
          APP_VERSION_CODE_BASE: ${{ vars.APP_VERSION_CODE_BASE }}
        run: python3 ci/pipeline.py version
      - name: Set up Corretto JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Set up Gradle without persisting signing build caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true
      - name: Install Android SDK packages
        # The runner image installs sdkmanager without adding it to PATH.
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'
      - name: Test CI routing and artifact checks
        run: python3 -B -m unittest discover -s ci -p 'test_*.py' -v
      - name: Restore and validate app configuration and upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 ci/pipeline.py prepare-signing
      - name: Test the merged commit and run Android Lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          ./gradlew :shared:testAndroidHostTest :androidApp:lintRelease \
            -PciVerification=false --no-daemon --no-configuration-cache --no-build-cache --stacktrace
      - name: Build signed release AAB and upload Crashlytics mapping
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          ./gradlew :androidApp:bundleRelease \
            -PciVerification=false --no-daemon --no-configuration-cache --no-build-cache --stacktrace
      - name: Verify and package the signed AAB
        id: package
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 ci/pipeline.py package
      - name: Upload signed AAB, checksum, metadata, and R8 reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: client/build/ci/artifacts/
          if-no-files-found: error
          retention-days: ${{ github.ref_name == 'main' && 90 || 14 }}
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-aab-reports-${{ github.ref_name }}-attempt${{ github.run_attempt }}
          path: |
            client/shared/build/test-results/testAndroidHostTest/
            client/shared/build/reports/tests/testAndroidHostTest/
            client/androidApp/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing and Firebase files
        if: always()
        run: |
          if [[ -f ci/pipeline.py ]]; then
            python3 ci/pipeline.py cleanup
          fi
