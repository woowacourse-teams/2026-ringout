name: Android PR Build

on:
  pull_request:
    branches: [client/release, main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/android-pr-build.yml'
      - 'client/ci/pipeline.py'
      - 'client/ci/api_config.py'
      - 'client/ci/production_config.py'
      - 'client/ci/ios_cd_gate.py'
      - 'client/ci/change_policy.py'
      - 'client/ci/android_internal_cd.py'
      - 'client/ci/android_production_cd.py'
      - 'client/ci/verify_developer_tools.py'
      - 'client/ci/upload-certificate.sha256'
      - '.github/workflows/build-release-aab.yml'
      - '.github/workflows/android-internal-cd.yml'
      - '.github/workflows/android-production-cd.yml'
      - 'client/androidApp/**'
      - 'client/shared/**'
      - 'client/developerTools/**'
      - '!client/shared/src/ios*/**'
      - '!client/developerTools/src/ios*/**'
      - 'client/*'
      - 'client/gradle/**'
      - 'client/buildSrc/**'
      - 'client/build-logic/**'
      - 'client/config/**'
      - 'client/configuration/**'
      - '.github/actions/**'
      - '.github/workflows/android-ci.yml'
      - 'client/ci/google-services.ci.json'
      - '!client/**/*.md'
      - '!client/**/docs/**'

permissions:
  contents: read

concurrency:
  group: android-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: client

jobs:
  build:
    name: Android unsigned app build and artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate promotion PR route
        run: python3 ci/pipeline.py route
      - name: Set up Corretto JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Branch pushes seed shared caches; PRs retain their own incremental caches.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Install Android SDK packages
        # The runner image installs sdkmanager without adding it to PATH.
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'
      - name: Build unsigned release AAB for promotion PR
        run: |
          ./gradlew :androidApp:bundleRelease \
            -PciVerification=true --no-daemon --no-configuration-cache --stacktrace --profile
      - name: Verify promotion AAB structure, R8 outputs, and absence of signing
        run: |
          python3 ci/pipeline.py verify-r8
          python3 ci/pipeline.py verify-unsigned
      - name: Upload verified unsigned AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-pr-aab-${{ github.event.pull_request.number }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: client/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload promotion build verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-pr-build-reports-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            client/build/reports/profile/
            client/androidApp/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 14
