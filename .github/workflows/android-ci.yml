name: Android CI

on:
  pull_request:
    branches: [client/develop, client/release, main]
    types: [opened, synchronize, reopened]
    paths:
      - 'client/ci/pipeline.py'
      - 'client/ci/api_config.py'
      - 'client/ci/production_config.py'
      - 'client/ci/ios_cd_gate.py'
      - 'client/ci/change_policy.py'
      - 'client/ci/android_internal_cd.py'
      - 'client/ci/android_production_cd.py'
      - 'client/ci/verify_developer_tools.py'
      - 'client/ci/upload-certificate.sha256'
      - '.github/workflows/build-release-aab.yml'
      - '.github/workflows/android-internal-cd.yml'
      - '.github/workflows/android-production-cd.yml'
      - 'client/androidApp/**'
      - 'client/shared/**'
      - 'client/developerTools/**'
      - '!client/shared/src/ios*/**'
      - '!client/developerTools/src/ios*/**'
      - 'client/*'
      - 'client/gradle/**'
      - 'client/buildSrc/**'
      - 'client/build-logic/**'
      - 'client/config/**'
      - 'client/configuration/**'
      - '.github/actions/**'
      - '.github/workflows/android-ci.yml'
      - 'client/ci/google-services.ci.json'
      - '!client/**/*.md'
      - '!client/**/docs/**'
  push:
    branches: [client/develop, client/release, main]
    paths:
      - 'client/androidApp/**'
      - 'client/shared/**'
      - 'client/developerTools/**'
      - '!client/shared/src/ios*/**'
      - '!client/developerTools/src/ios*/**'
      - 'client/*'
      - 'client/gradle/**'
      - 'client/buildSrc/**'
      - 'client/build-logic/**'
      - 'client/config/**'
      - 'client/configuration/**'
      - '.github/actions/**'
      - '.github/workflows/android-ci.yml'
      - 'client/ci/google-services.ci.json'
      - '!client/**/*.md'
      - '!client/**/docs/**'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: client

jobs:
  changes:
    name: Check client changes and PR route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      client_changed: ${{ steps.changes.outputs.client_changed }}
      promotion_build_required: ${{ steps.changes.outputs.promotion_build_required }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed paths and PR route
        id: changes
        run: python3 ci/pipeline.py changes

  quality:
    name: Android tests and lint
    needs: changes
    if: needs.changes.outputs.client_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Corretto JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Branch pushes seed shared caches; PRs retain their own incremental caches.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Install Android SDK packages
        # The runner image installs sdkmanager without adding it to PATH.
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and lint Android
        run: |
          ./gradlew :shared:testAndroidHostTest :androidApp:lintRelease \
            -PciVerification=true --no-daemon --no-configuration-cache --stacktrace --profile
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-ci-reports-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            client/build/reports/profile/
            client/shared/build/test-results/testAndroidHostTest/
            client/shared/build/reports/tests/testAndroidHostTest/
            client/androidApp/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14

  promotion-build:
    name: Android PR build verification (no deployment)
    needs: [changes, quality]
    if: needs.changes.outputs.promotion_build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Corretto JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Branch pushes seed shared caches; PRs retain their own incremental caches.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Install Android SDK packages
        # The runner image installs sdkmanager without adding it to PATH.
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'
      - name: Build unsigned release AAB for promotion PR
        run: |
          ./gradlew :androidApp:bundleRelease \
            -PciVerification=true --no-daemon --no-configuration-cache --stacktrace --profile
      - name: Verify promotion AAB structure, R8 outputs, and absence of signing
        run: |
          python3 ci/pipeline.py verify-r8
          python3 ci/pipeline.py verify-unsigned
      - name: Upload verified unsigned AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-pr-aab-${{ github.event.pull_request.number }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: client/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload promotion build verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-pr-build-reports-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            client/build/reports/profile/
            client/androidApp/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 14

  result:
    # Summarize triggered runs; path-filtered workflows must not be required for every PR.
    name: Android CI
    if: always()
    needs: [changes, quality, promotion-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLIENT_CHANGED: ${{ needs.changes.outputs.client_changed }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PROMOTION_BUILD_REQUIRED: ${{ needs.changes.outputs.promotion_build_required }}
          PROMOTION_BUILD_RESULT: ${{ needs.promotion-build.result }}
        run: python3 ci/pipeline.py gate
