spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  flyway:
    enabled: true
    baseline-version: 1
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
  application:
    name: ringout

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: false

server:
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${ADMIN_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      environment: ${APP_ENV:${spring.profiles.active:local}}
      service: ringout

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.ringout.api

app:
  admin:
    google:
      enabled: ${ADMIN_GOOGLE_ENABLED:false}
      client-id: ${ADMIN_GOOGLE_CLIENT_ID:}
      client-secret: ${ADMIN_GOOGLE_CLIENT_SECRET:}
      # Google 콘솔의 승인된 리디렉션 URI와 동일하게 설정합니다.
      redirect-uri: ${ADMIN_GOOGLE_REDIRECT_URI:}
  file:
    image:
      profile-directory: ${AWS_S3_PROFILE_IMAGE_DIRECTORY:profiles}
      room-directory: ${AWS_S3_ROOM_IMAGE_DIRECTORY:rooms}
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      root-directory: ${AWS_S3_ROOT_DIRECTORY:}
      region: ${AWS_REGION:ap-northeast-2}
    cloudfront:
      base-url: ${AWS_CLOUDFRONT_BASE_URL:}
  firebase:
    enabled: ${IS_FIREBASE_ENABLED:false}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  test-login:
    enabled: ${IS_TEST_LOGIN_ENABLED:false}
    secret: ${TEST_LOGIN_SECRET:}
    allowed-provider-ids: ${TEST_LOGIN_ALLOWED_PROVIDER_IDS:}
  api-version: v1
  auth:
    apple:
      client-id: ${APPLE_CLIENT_ID}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS}
    refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS}
    signup-token-expiration-millis: ${JWT_SIGNUP_TOKEN_EXPIRATION_MILLIS}
