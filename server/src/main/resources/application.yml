spring:
  application:
    name: ringout

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ringout?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ringringring}
    password: ${DB_PASSWORD:ringringring}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
