name: ${COMPOSE_PROJECT_NAME:-ringout}

services:
  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    container_name: ${SERVER_CONTAINER_NAME:-ringout-server}
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DDL_AUTO: ${DDL_AUTO:-validate}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:?APPLE_CLIENT_ID is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRATION_MILLIS: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:?JWT_ACCESS_TOKEN_EXPIRATION_MILLIS is required}
      JWT_REFRESH_TOKEN_EXPIRATION_MILLIS: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:?JWT_REFRESH_TOKEN_EXPIRATION_MILLIS is required}
      JWT_SIGNUP_TOKEN_EXPIRATION_MILLIS: ${JWT_SIGNUP_TOKEN_EXPIRATION_MILLIS:?JWT_SIGNUP_TOKEN_EXPIRATION_MILLIS is required}
      ADMIN_GOOGLE_ENABLED: ${ADMIN_GOOGLE_ENABLED:-false}
      ADMIN_GOOGLE_CLIENT_ID: ${ADMIN_GOOGLE_CLIENT_ID:-}
      ADMIN_GOOGLE_CLIENT_SECRET: ${ADMIN_GOOGLE_CLIENT_SECRET:-}
      ADMIN_GOOGLE_REDIRECT_URI: ${ADMIN_GOOGLE_REDIRECT_URI:-}
      ADMIN_SESSION_COOKIE_SECURE: ${ADMIN_SESSION_COOKIE_SECURE:-true}
      IS_TEST_LOGIN_ENABLED: ${IS_TEST_LOGIN_ENABLED:-false}
      TEST_LOGIN_SECRET: ${TEST_LOGIN_SECRET:-}
      TEST_LOGIN_ALLOWED_PROVIDER_IDS: ${TEST_LOGIN_ALLOWED_PROVIDER_IDS:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_CLOUDFRONT_BASE_URL: ${AWS_CLOUDFRONT_BASE_URL:?AWS_CLOUDFRONT_BASE_URL is required}
      AWS_S3_ROOT_DIRECTORY: ${AWS_S3_ROOT_DIRECTORY:?AWS_S3_ROOT_DIRECTORY is required}
      AWS_S3_PROFILE_IMAGE_DIRECTORY: ${AWS_S3_PROFILE_IMAGE_DIRECTORY:-profiles}
      AWS_S3_ROOM_IMAGE_DIRECTORY: ${AWS_S3_ROOM_IMAGE_DIRECTORY:-rooms}
      IS_FIREBASE_ENABLED: ${IS_FIREBASE_ENABLED:-false}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      AWS_EC2_METADATA_V1_DISABLED: "true"
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_ENV: ${APP_ENV:-prod}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -Duser.timezone=Asia/Seoul
        -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:?OTEL_SERVICE_NAME is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:?OTEL_EXPORTER_OTLP_PROTOCOL is required}
      OTEL_METRICS_EXPORTER: none
    volumes:
      - type: bind
        source: ${OTEL_AGENT_PATH:-/opt/opentelemetry/opentelemetry-javaagent.jar}
        target: /otel/opentelemetry-javaagent.jar
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge
