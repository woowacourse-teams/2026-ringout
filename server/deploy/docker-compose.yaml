# MySQL용 Docker Compose. DB EC2에서 실행하며 MYSQL_BIND_ADDRESS는 사설 IP로 설정한다.
name: ${COMPOSE_PROJECT_NAME:-ringout}

services:
  mysql:
    image: mysql:8.4
    container_name: ringout-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  # DB EC2의 .env에 COMPOSE_PROFILES=monitoring을 설정한 경우에만 실행
  mysqld-exporter:
    profiles: [monitoring]
    image: prom/mysqld-exporter:v0.20.0
    container_name: ringout-mysqld-exporter
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      # 비활성 프로필도 변수 치환은 수행하므로 개발에서는 빈 값 허용
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${MYSQL_EXPORTER_USER:-exporter}
    ports:
      - "9104:9104"
    networks:
      - backend

  node-exporter:
    profiles: [monitoring]
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: ringout-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
